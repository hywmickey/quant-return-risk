; =====================================================================
; 量化分析脚本统一配置
;
; script/ 下所有脚本通过 script/config_loader.php（PHP parse_ini_file，
; INI_SCANNER_RAW 模式）读取本文件。修改本文件无需改动任何脚本。
;
; 一、[dirs]            数据目录（相对项目根目录或写绝对路径）
; 二、[titles_funds]    基金代码 => 中文标题（顺序 = 抓取顺序）
; 三、[titles_indexes]  指数 CSV 文件名 => 中文标题
;
; 设计说明：
;   parse_ini_file 默认模式会把 section 名和 key 里的 "." 都当作层级分隔符，
;   导致 "us30_daily.csv" 这样的 key 被错误拆成嵌套数组。
;   本文件使用 INI_SCANNER_RAW 模式（一切按原始字符串处理），
;   section 名用 "_" 表达层级语义（dirs / titles_funds / titles_indexes），
;   从而同时解决 section 层级表达和 key 里 ".csv" 的原样保留问题。
; =====================================================================

; 一、数据目录
[dirs]
daily     = data/daily
drawdown  = data/drawdown
fund      = data/fund
html      = html
portfolio = data/portfolio

; 二、基金代码 => 中文标题（数组顺序 = 批量抓取顺序）
[titles_funds]
005561 = 华夏恒生ETF联接A(005561)
008114 = 天弘中证红利低波动100联接A(008114)
003376 = 广发中债7-10年期国开行债券指数A(003376)
017091 = 华夏中证港股通高股息投资指数发起式A(017091)
050025 = 博时标普500ETF联接A(050025)
096001 = 嘉实港股通量化精选A(096001)
160213 = 国泰纳斯达克100ETF联接A(160213)
161128 = 易方达黄金主题A(161128)
519981 = 长信利发债券A(519981)

; 三、指数 CSV 文件名 => 中文标题
[titles_indexes]
us30_daily.csv             = 道琼斯工业平均指数 (US30)
sp500_daily.csv            = 标普 500 指数
nasdaq100_daily.csv        = 纳斯达克 100 指数
ndxtmc_daily.csv           = NASDAQ 100 科技行业市值加权指数 NDXTMC
ndxtmc_tr_daily.csv        = NASDAQ 100 科技行业市值加权指数 NDXTMCTR（总收益）
nyfang_daily.csv           = NYSE FANG+ 指数
msci_usa_50_GRTR_DAILY.csv = MSCI USA 50 指数（GRTR 含股息再投资）

; 四、投资组合回测定义（script/portfolio_nav.php 读取）
;   每个 section 名以 portfolio_ 开头即被识别为一个组合，后缀作为组合的 key，
;   组合净值 CSV 输出为 data/portfolio/portfolio_{key}_daily.csv
;
;   name      = 组合显示名（用于 HTML 页面标题）
;   funds     = 基金代码:权重,基金代码:权重,...（至少 2 只，权重之和须等于 100）
;   rebalance = 再平衡触发方式，四种类型：
;               none        —— 买入后持有，权重自然漂移，不再平衡
;               period      —— 每周期最后一个交易日再平衡，周期由 period 指定
;               anniversary —— 按基准日的每年周年再平衡（周年日当天或之后首个交易日）
;               threshold   —— 任一基金实际权重与目标权重相差达到 threshold 个百分点即再平衡
;   period    = rebalance=period 时生效：monthly / quarterly / semiannual / annual
;   threshold = rebalance=threshold 时生效：偏离阈值（百分点，0~100），如 10 表示 10%
;
;   多只基金成立时间不一致时，以成立最晚的基金的首个数据日为组合基准日；
;   交易日历取各基金日期的并集，某基金当日缺数据时用前一交易日净值填充。

[portfolio_bond_nasdaq]
name      = 债基+纳指组合（50/50 年度再平衡）
funds     = 003376:50,160213:50
rebalance = period
period    = annual

[portfolio_bond_nasdaq_hold]
name      = 债基+纳指组合（50/50 不再平衡）
funds     = 003376:50,160213:50
rebalance = none

[portfolio_bond_nasdaq_anniversary]
name      = 债基+纳指组合（50/50 基准日周年再平衡）
funds     = 003376:50,160213:50
rebalance = anniversary

[portfolio_bond_nasdaq_threshold]
name      = 债基+纳指组合（50/50 偏离 10% 再平衡）
funds     = 003376:50,160213:50
rebalance = threshold
threshold = 10

[portfolio_bond_nasdaq_threshold5]
name      = 债基+纳指组合（50/50 偏离 5% 再平衡）
funds     = 003376:50,160213:50
rebalance = threshold
threshold = 5
